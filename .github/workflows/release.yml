name: Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.2.0

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-release.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m PyInstaller --clean --noconfirm OpenOCD-Scope.spec
      - name: Smoke test packaged EXE
        shell: pwsh
        run: |
          $env:OPENOCD_SCOPE_SMOKE_TEST = "1"
          $process = Start-Process -FilePath ".\dist\OpenOCD-Scope.exe" -PassThru -Wait
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - name: Create release archives
        shell: pwsh
        run: |
          $version = "${{ inputs.tag }}".TrimStart("v")
          $windowsArchive = "OpenOCD-Scope-Studio-$version-Windows-x64.zip"
          $sourceArchive = "OpenOCD-Scope-Studio-$version-source.zip"
          New-Item -ItemType Directory -Path release, release-stage -Force | Out-Null
          Copy-Item dist\OpenOCD-Scope.exe, README.md, RELEASE_NOTES.md, LICENSE, THIRD_PARTY_NOTICES.md release-stage
          Copy-Item dist\OpenOCD-Scope.exe release\OpenOCD-Scope.exe
          Compress-Archive -Path release-stage\* -DestinationPath "release\$windowsArchive" -CompressionLevel Optimal
          git archive --format=zip --output "release\$sourceArchive" HEAD
          $exe = (Get-FileHash -Algorithm SHA256 release\OpenOCD-Scope.exe).Hash
          $windows = (Get-FileHash -Algorithm SHA256 "release\$windowsArchive").Hash
          $source = (Get-FileHash -Algorithm SHA256 "release\$sourceArchive").Hash
          @(
            "$exe  OpenOCD-Scope.exe"
            "$windows  $windowsArchive"
            "$source  $sourceArchive"
          ) | Set-Content -Encoding ascii release\CHECKSUMS.txt
          "WINDOWS_ARCHIVE=$windowsArchive" | Add-Content $env:GITHUB_ENV
          "SOURCE_ARCHIVE=$sourceArchive" | Add-Content $env:GITHUB_ENV
      - name: Upload and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ inputs.tag }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ inputs.tag }}" --draft --target "${{ github.sha }}" --title "OpenOCD Scope Studio ${{ inputs.tag }}" --notes-file RELEASE_NOTES.md
          }
          gh release upload "${{ inputs.tag }}" release\OpenOCD-Scope.exe "release\$env:WINDOWS_ARCHIVE" "release\$env:SOURCE_ARCHIVE" release\CHECKSUMS.txt --clobber
          gh release edit "${{ inputs.tag }}" --draft=false --latest
