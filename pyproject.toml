[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openocd-scope"
version = "0.2.0"
description = "OpenOCD based variable monitor, oscilloscope and data exporter"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "xxjqrlxsh" }]
keywords = ["OpenOCD", "embedded", "oscilloscope", "Keil", "IAR", "GD32"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Embedded Systems",
]
dependencies = [
  "PySide6>=6.6",
  "pyelftools>=0.31",
  "pyqtgraph>=0.13.7",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.10", "pytest>=8.0", "ruff>=0.6"]

[project.scripts]
openocd-scope = "openocd_scope.app:main"

[project.urls]
Repository = "https://github.com/xxjqrlxsh/OpenOCD-Scope-Studio"
Issues = "https://github.com/xxjqrlxsh/OpenOCD-Scope-Studio/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/openocd_scope"]

[tool.hatch.build]
include = ["src/openocd_scope/**/*.py", "src/openocd_scope/**/*.cfg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
