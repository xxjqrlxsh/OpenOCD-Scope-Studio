# GD32F303/F305/F307 Cortex-M4 compatibility target.
# These devices use the STM32F1-compatible flash controller with an M4 SW-DP.
# The application selects SWD before loading this target when transport is auto.
set CHIPNAME gd32f30x
if { [using_jtag] } {
    set CPUTAPID 0x4ba00477
} else {
    set CPUTAPID 0x2ba01477
}
set WORKAREASIZE 0x4000
source [find target/stm32f1x.cfg]
